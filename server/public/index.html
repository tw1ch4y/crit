<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0c0f" />
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <title>Panel igraonice</title>
  <link rel="stylesheet" href="/css/style.css?v=__VERZIJA__" />
</head>
<body>
  <!-- Login -->
  <div id="loginView" class="login-wrap">
    <div class="login-card">
      <img class="login-logo-img" src="/img/crit-logo.png" alt="Crit" />
      <div class="login-sub">Prijava na upravljački panel</div>
      <form id="loginForm">
        <div class="field"><label>Korisničko ime</label><input id="loginUser" autocomplete="username" autofocus /></div>
        <div class="field"><label>Lozinka</label><input id="loginPass" type="password" autocomplete="current-password" /></div>
        <div class="err-msg" id="loginErr"></div>
        <button class="btn btn-primary btn-block" type="submit">Prijavi se</button>
      </form>
    </div>
  </div>

  <!-- App -->
  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="side-logo"><img class="side-logo-img" src="/img/crit-logo.png" alt="Crit" /></div>
      <nav class="nav" id="nav">
        <a class="nav-item active" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="label">Kontrolna tabla</span></a>
        <a class="nav-item" data-view="players"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="label">Igrači</span></a>
        <a class="nav-item" data-view="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 4 6v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6l-2-4Z"/><path d="M4 6h16M9 10a3 3 0 0 0 6 0"/></svg><span class="label">Porudžbine</span><span class="count hidden" id="ordersCount">0</span></a>
        <a class="nav-item" data-view="pos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg><span class="label">Kasa</span></a>
        <a class="nav-item" data-view="rezervacije"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="label">Rezervacije</span><span class="count hidden" id="rezCount">0</span></a>
        <div class="nav-sec" data-owner="1">Katalog</div>
        <a class="nav-item" data-view="shop" data-owner="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18l-1.5 11a1 1 0 0 1-1 .9H5.5a1 1 0 0 1-1-.9Z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg><span class="label">Shop</span></a>
        <a class="nav-item" data-view="games" data-owner="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/><rect x="2" y="6" width="20" height="12" rx="4"/></svg><span class="label">Igre</span></a>
        <a class="nav-item" data-view="tools" data-owner="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg><span class="label">Internet alati</span></a>
        <a class="nav-item" data-view="izgled" data-owner="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 15 5-5 4 4 3-3 6 6"/><circle cx="8.5" cy="8.5" r="1.5"/></svg><span class="label">Izgled launchera</span></a>
        <div class="nav-sec" data-owner="1">Sistem</div>
        <a class="nav-item" data-view="computers" data-owner="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span class="label">Računari</span></a>
        <a class="nav-item" data-view="install" data-owner="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span class="label">Instalacije</span></a>
        <div class="nav-sec" data-owner="1">Poslovanje</div>
        <a class="nav-item" data-view="reports" data-owner="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="7" rx="0.5"/><rect x="12.5" y="7" width="3" height="11" rx="0.5"/><rect x="18" y="4" width="3" height="14" rx="0.5"/></svg><span class="label">Izveštaji</span></a>
        <a class="nav-item" data-view="shifts" data-owner="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="label">Smene</span></a>
        <a class="nav-item" data-view="logs" data-owner="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span class="label">Logovi</span></a>
        <div class="nav-sec" data-owner="1">Uprava</div>
        <a class="nav-item" data-view="staff" data-owner="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg><span class="label">Radnici</span></a>
        <a class="nav-item" data-view="settings" data-owner="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg><span class="label">Podešavanja</span></a>
      </nav>
      <div class="side-foot">
        <div id="shiftBar"></div>
        <div class="profile" id="profileBtn">
          <div class="avatar" id="pfAvatar">A</div>
          <div><div class="pf-name" id="pfName">admin</div><div class="pf-role" id="pfRole">vlasnik</div></div>
          <svg class="pf-caret" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
        </div>
        <div class="pf-menu hidden" id="pfMenu">
          <button id="pmPassword"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Promeni lozinku</button>
          <div class="sep"></div>
          <button class="danger" id="pmLogout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Odjavi se</button>
        </div>
      </div>
    </aside>

    <div class="content-wrap">
      <div class="topbar">
        <div class="side-logo"><img class="side-logo-img" src="/img/crit-logo.png" alt="Crit" /></div>
      </div>
      <main class="main" id="main"></main>
    </div>
  </div>

  <div class="conn-banner hidden" id="connBanner"><span class="cb-dot"></span>Veza sa serverom je prekinuta - povezivanje u toku</div>
  <div class="bulkbar hidden" id="bulkBar"></div>
  <div class="istice-lista" id="isticeLista"></div>
  <div class="toasts" id="toasts"></div>
  <div id="modalRoot"></div>
  <div id="confirmRoot"></div>

  <script src="/js/icons.js?v=__VERZIJA__"></script>
  <script src="/js/app.js?v=__VERZIJA__"></script>
</body>
</html>
