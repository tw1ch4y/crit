<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <title>Crit</title>
  <!-- Isti font kao u launcheru. Ovo iskace PREKO IGRE i igrac to vidi vise
       nego bilo koji ekran launchera - da je u drugom fontu, bilo bi jedino
       mesto koje ispada iz celine. -->
  <link rel="stylesheet" href="css/font.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { height: 100%; background: transparent; overflow: hidden; }
    body { display: flex; align-items: flex-start; justify-content: center; padding-top: 16px;
           font-family: "Chakra Petch", "Segoe UI", system-ui, sans-serif; }

    .kartica {
      display: flex; align-items: center; gap: 14px;
      background: rgba(7, 12, 28, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-left: 4px solid #ff3b3b;
      border-radius: 12px;
      padding: 14px 22px 14px 18px;
      box-shadow: 0 18px 50px -12px rgba(0, 0, 0, 0.85);
      color: #f2f3f8;
      max-width: 620px;
      animation: ulaz 0.35s cubic-bezier(0.22, 0.9, 0.3, 1);
    }
    @keyframes ulaz { from { opacity: 0; transform: translateY(-18px); } }
    .kartica.zuta { border-left-color: #ffb527; }
    .kartica.plava { border-left-color: var(--kuca, #2f6ae8); }

    .ikona { width: 30px; height: 30px; flex-shrink: 0; }
    .tekst { min-width: 0; }
    .naslov { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
    .opis { font-size: 13px; color: #a6aabb; margin-top: 3px; }
  </style>
</head>
<body>
  <div class="kartica" id="kartica">
    <svg class="ikona" id="ikona" viewBox="0 0 24 24" fill="none" stroke="#ff3b3b" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
    </svg>
    <div class="tekst">
      <div class="naslov" id="naslov">-</div>
      <div class="opis" id="opis"></div>
    </div>
  </div>
  <script>
    const IKONE = {
      vreme: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      poruka: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/>',
    };
    window.critOverlay && window.critOverlay.naPrikaz(({ naslov, opis, vrsta, boja, kuca }) => {
      document.getElementById("naslov").textContent = naslov || "";
      document.getElementById("opis").textContent = opis || "";
      const ik = document.getElementById("ikona");
      ik.innerHTML = IKONE[vrsta] || IKONE.vreme;
      // Boja kuce stize uz poruku (main.js je pamti iz "welcome"). Obavestenje
      // je zaseban prozor i ne vidi CSS launchera, pa bi bez ovoga svaka
      // igraonica imala istu plavu - bas na mestu gde se boja najvise vidi.
      if (kuca) document.documentElement.style.setProperty("--kuca", kuca);
      ik.setAttribute("stroke", boja === "zuta" ? "#ffb527" : boja === "plava" ? (kuca || "#2f6ae8") : "#ff3b3b");
      const k = document.getElementById("kartica");
      k.className = "kartica " + (boja || "");
      // ponovo pokreni animaciju pri svakom prikazu
      k.style.animation = "none"; void k.offsetWidth; k.style.animation = "";
    });
  </script>
</body>
</html>
