# Svi testovi na svaki push i pull request. Testovi dizu svoje servere na
# lokalnim portovima i rade nad svojim praznim bazama; spoljni servisi nisu
# potrebni.
name: Provera sistema

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  testovi:
    runs-on: windows-latest    # isto okruzenje kao u igraonici
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # Ista glavna verzija kao na serveru u igraonici (node:sqlite).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Zavisnosti servera
        working-directory: server
        run: npm ci --omit=dev

      - name: Verzija se poklapa na svim mestima
        run: node verzija.mjs

      # Bez argumenta alat samo proverava da je ime isto na svim mestima.
      - name: Ime igraonice se poklapa na svim mestima
        run: node igraonica.mjs

      - name: Sve suite
        working-directory: testovi
        run: node pokreni-sve.mjs

      # Radne baze testova, za ispitivanje greske koja se javlja samo na CI-ju.
      - name: Sacuvaj radne baze ako je palo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: radne-baze
          path: testovi/.radno/
          retention-days: 7
