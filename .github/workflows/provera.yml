# Testovi na svaku izmenu.
#
# CRIT ima preko 1400 automatskih provera, ali su do sada zavisile od toga da se
# neko seti da otkuca komandu. Sve sto zavisi od pamcenja je bag u procesu:
# proba se preskoci bas onog dana kad je najpotrebnija, pred izdavanje nove
# verzije, kad se zuri.
#
# Suite dizu svoje servere na lokalnim portovima i svoje prazne baze, pa im ne
# treba nista spolja - ni baza, ni servis, ni mreza.
name: Provera sistema

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  testovi:
    runs-on: windows-latest    # launcher je Windows program; isto okruzenje kao u igraonici
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # node:sqlite je ugradjen u Node, pa serveru ne treba build korak.
      # Verzija mora da prati onu na glavnom racunaru u igraonici.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Zavisnosti servera
        working-directory: server
        run: npm ci --omit=dev

      - name: Verzija se poklapa na svim mestima
        run: node verzija.mjs

      - name: Sve suite
        working-directory: testovi
        run: node pokreni-sve.mjs

      # Kad nesto padne, radne baze su jedino iz cega se vidi STA je bilo u njima
      # u tom trenutku. Bez ovoga se kvar koji se javlja samo na CI-ju ne moze
      # ispitati.
      - name: Sacuvaj radne baze ako je palo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: radne-baze
          path: testovi/.radno/
          retention-days: 7
