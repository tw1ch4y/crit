    <text x="22.4" y="32" fill="#e8eaf0" font-family="Segoe UI, sans-serif" font-size="20" font-weight="800" letter-spacing="0.8">BANER IGRE - pozadina ekrana prijave</text>
    <text x="22.4" y="57.6" fill="#8b91a0" font-family="Segoe UI, sans-serif" font-size="13.6">Široka slika koja stoji iza forme za prijavu, ako nije okačena posebna pozadina prijave.</text>
    <text x="2777.6" y="36.8" fill="#e8eaf0" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="22.4" font-weight="800">2800 x 400 px</text>

    <rect x="0" y="350.4" width="2800" height="49.6" fill="#05060a" fill-opacity="0.93"/>
    <text x="22.4" y="371.2" fill="#8b91a0" font-family="Segoe UI, sans-serif" font-size="12.8">Slika je zamućena i utišana ispod forme, pa sitni detalji ne igraju - važi opšti utisak i boja.</text>
    <text x="22.4" y="390.4" fill="#8b91a0" font-family="Segoe UI, sans-serif" font-size="12">crvena zona = sadrzaj launchera stoji preko slike   ·   zelena zona = tu stavi ono sto mora da se vidi</text>
